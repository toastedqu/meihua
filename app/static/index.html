<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="梅花易数双数、三数排盘；本卦、互卦、变卦，体用生克与卦爻辞。">
    <title>梅花易数排盘</title>
    <link rel="stylesheet" href="static/styles.css">
  </head>
  <body>
    <main>
      <h1>梅花易数排盘</h1>
      <noscript><p class="error">请启用 JavaScript 后使用排盘功能。</p></noscript>

      <form id="divination-form">
        <div class="field">
          <label for="question">所占之事 <span class="muted">（选填）</span></label>
          <textarea id="question" name="question" maxlength="500" placeholder="记录所问的人、事及关系；系统不会按文字猜测或生成断语。"></textarea>
        </div>
        <fieldset>
          <legend>排盘方法</legend>
          <div class="method-options">
            <label class="inline"><input type="radio" name="method" value="two" checked> 双数法</label>
            <label class="inline"><input type="radio" name="method" value="three"> 三数法</label>
          </div>
          <small id="method-description">前两数分别定上下卦；折算后的两个卦数加时辰数，除6取动爻。</small>
        </fieldset>
        <fieldset>
          <legend>起卦数字</legend>
          <div class="number-fields">
            <label class="field" for="number-1">第一数 · 上卦
              <input id="number-1" name="number_1" type="text" inputmode="numeric" pattern="[0-9]{1,100}" maxlength="100" autocomplete="off" placeholder="例如 12" required>
            </label>
            <label class="field" for="number-2">第二数 · 下卦
              <input id="number-2" name="number_2" type="text" inputmode="numeric" pattern="[0-9]{1,100}" maxlength="100" autocomplete="off" placeholder="例如 23" required>
            </label>
            <label class="field" id="third-number-field" for="number-3" hidden>第三数 · 动爻
              <input id="number-3" name="number_3" type="text" inputmode="numeric" pattern="[0-9]{1,100}" maxlength="100" autocomplete="off" placeholder="例如 6" disabled>
            </label>
          </div>
        </fieldset>
        <div class="field" id="hour-field">
          <label for="hour">时辰</label>
          <select id="hour" name="hour" required>
            <option value="" selected disabled>请选择时辰</option>
            <option value="1">子 · 23:00–01:00 · 1</option>
            <option value="2">丑 · 01:00–03:00 · 2</option>
            <option value="3">寅 · 03:00–05:00 · 3</option>
            <option value="4">卯 · 05:00–07:00 · 4</option>
            <option value="5">辰 · 07:00–09:00 · 5</option>
            <option value="6">巳 · 09:00–11:00 · 6</option>
            <option value="7">午 · 11:00–13:00 · 7</option>
            <option value="8">未 · 13:00–15:00 · 8</option>
            <option value="9">申 · 15:00–17:00 · 9</option>
            <option value="10">酉 · 17:00–19:00 · 10</option>
            <option value="11">戌 · 19:00–21:00 · 11</option>
            <option value="12">亥 · 21:00–23:00 · 12</option>
          </select>
        </div>
        <div class="field">
          <label for="season">月令</label>
          <select id="season" name="season" required>
            <option value="" selected disabled>请选择所占时的月令</option>
            <option value="spring">春 · 寅卯辰月</option>
            <option value="summer">夏 · 巳午未月</option>
            <option value="autumn">秋 · 申酉戌月</option>
            <option value="winter">冬 · 亥子丑月</option>
            <option value="earth">四季 · 辰戌丑未月末各十八天</option>
          </select>
        </div>
        <div class="form-actions">
          <button id="chart-button" type="submit">排盘</button>
          <span id="form-status" role="status"></span>
        </div>
      </form>

      <p id="error" role="alert" hidden></p>
      <section id="result" aria-label="排盘结果" tabindex="-1" hidden></section>

      <footer>
        <p>确定性规则排盘；无模型调用，不保存所占之事。服务器模式把输入发往当前服务，静态模式在浏览器内排盘。</p>
        <p><a href="https://zh.wikisource.org/wiki/周易" target="_blank" rel="noopener noreferrer">《周易》古经 · 维基文库</a></p>
      </footer>
    </main>
    <!-- STATIC_BACKEND -->
    <script src="static/app.js" defer></script>
  </body>
</html>
